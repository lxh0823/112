<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹跑者 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060f;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;top:12px;left:16px;font-size:20px;text-shadow:0 0 8px #0ff;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.7);text-align:center;cursor:pointer}
#msg h1{font-size:48px;margin:0 0 12px;color:#0ff;text-shadow:0 0 20px #0ff}
#msg p{margin:4px;opacity:.85}
</style>
</head>
<body>
<div id="hud">分数 <span id="s">0</span> · 最高 <span id="b">0</span></div>
<div id="msg"><h1>霓虹跑者 3D</h1><p>← → / A D 换道 · 空格 / ↑ 跳跃</p><p>手机：左右滑动换道，上滑跳跃</p><p>躲开红色障碍，吃黄色能量球</p><p><b>点击或按空格开始</b></p></div>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060f);
scene.fog=new THREE.Fog(0x05060f,20,90);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.AmbientLight(0x6070ff,.6));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(3,10,5);scene.add(dl);

const LW=2.5;
// floor tiles & grid
const floor=new THREE.Mesh(new THREE.PlaneGeometry(LW*3+1,400),new THREE.MeshStandardMaterial({color:0x0a0f2a}));
floor.rotation.x=-Math.PI/2;floor.position.z=-150;scene.add(floor);
const grid=new THREE.GridHelper(400,160,0x00ffff,0x0a4a6a);grid.scale.x=(LW*3+1)/400;grid.position.z=-150;scene.add(grid);
for(const x of[-1.5*LW,1.5*LW]){const m=new THREE.Mesh(new THREE.BoxGeometry(.1,.3,400),new THREE.MeshBasicMaterial({color:0xff00ff}));m.position.set(x,.15,-150);scene.add(m)}
// stars
const sp=[];for(let i=0;i<600;i++)sp.push((Math.random()-.5)*160,Math.random()*60+3,-Math.random()*200);
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.25})));

// player
const player=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,4),new THREE.MeshStandardMaterial({color:0x00ffff,emissive:0x006688}));
player.rotation.x=-Math.PI/2;
const pg=new THREE.Group();pg.add(player);scene.add(pg);

const obsGeo=new THREE.BoxGeometry(LW*.8,1.2,1.2),obsMat=new THREE.MeshStandardMaterial({color:0xff2244,emissive:0x660011});
const orbGeo=new THREE.SphereGeometry(.4,16,16),orbMat=new THREE.MeshStandardMaterial({color:0xffdd00,emissive:0xaa8800});
let obs=[],orbs=[],lane=0,tx=0,y=0,vy=0,speed,score,alive=false,spawnZ,best=+localStorage.neonBest||0;
const $=id=>document.getElementById(id);$('b').textContent=best;

function reset(){
  [...obs,...orbs].forEach(o=>scene.remove(o));obs=[];orbs=[];
  lane=0;tx=0;y=0;vy=0;speed=14;score=0;spawnZ=-20;pg.position.set(0,0,0);
}
function spawnRow(){
  const z=spawnZ;spawnZ-=Math.max(8,16-speed*.2);
  const free=Math.floor(Math.random()*3)-1;
  for(let l=-1;l<=1;l++){
    if(l===free){ if(Math.random()<.7){const o=new THREE.Mesh(orbGeo,orbMat);o.position.set(l*LW,1,z);scene.add(o);orbs.push(o)} continue}
    if(Math.random()<.75){const o=new THREE.Mesh(obsGeo,obsMat);o.position.set(l*LW,.6,z);scene.add(o);obs.push(o)}
  }
}
function start(){reset();alive=true;$('msg').style.display='none'}
function jump(){if(alive&&y<=0.001)vy=9}
function move(d){if(alive)lane=Math.max(-1,Math.min(1,lane+d))}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);
  else if(e.code==='ArrowRight'||e.code==='KeyD')move(1);
  else if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();alive?jump():start()}
});
$('msg').addEventListener('click',start);
let t0;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>30)move(dx>0?1:-1);else if(dy<-30)jump();t0=null});

function die(){
  alive=false;const s=Math.floor(score);
  if(s>best){best=s;localStorage.neonBest=s;$('b').textContent=s}
  $('msg').innerHTML=`<h1>游戏结束</h1><p>得分 ${s}</p><p><b>点击或按空格重新开始</b></p>`;$('msg').style.display='flex';
}
const clock=new THREE.Clock();
reset();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(alive){
    speed+=dt*.4;score+=dt*speed;
    $('s').textContent=Math.floor(score);
    tx=lane*LW;pg.position.x+=(tx-pg.position.x)*Math.min(1,dt*14);
    vy-=24*dt;y=Math.max(0,y+vy*dt);if(y===0&&vy<0)vy=0;
    pg.position.y=.5+y;
    // world moves toward player
    const dz=speed*dt;
    for(const o of obs)o.position.z+=dz;
    for(const o of orbs){o.position.z+=dz;o.rotation.y+=dt*3}
    // keep spawning ahead
    while(spawnZ>-110)spawnRow();
    spawnZ+=dz;
    // collisions
    const px=pg.position.x;
    for(const o of obs)if(Math.abs(o.position.z)<1&&Math.abs(o.position.x-px)<LW*.4+.4&&y<.9){die();break}
    orbs=orbs.filter(o=>{
      if(Math.abs(o.position.z)<1&&Math.abs(o.position.x-px)<1&&Math.abs(o.position.y-(.5+y))<1){score+=50;scene.remove(o);return false}
      if(o.position.z>6){scene.remove(o);return false}return true});
    obs=obs.filter(o=>{if(o.position.z>6){scene.remove(o);return false}return true});
  }
  const cx=pg.position.x*.6;
  cam.position.set(cx,3.2+y*.4,6);cam.lookAt(pg.position.x*.8,1,-8);
  player.rotation.z+=dt*2;
  ren.render(scene,cam);
}
loop();
</script>
</body>
</html>
