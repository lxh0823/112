<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 枪战游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }

    /* 开始菜单 */
    #startScreen {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff;
    }
    #startScreen h1 {
      font-size: 56px; margin-bottom: 10px;
      text-shadow: 0 0 20px #e94560, 0 0 40px #e94560;
      letter-spacing: 4px;
    }
    #startScreen .subtitle { font-size: 18px; color: #aaa; margin-bottom: 40px; }
    #startScreen button {
      padding: 14px 50px; font-size: 22px; border: 2px solid #e94560;
      background: transparent; color: #e94560; border-radius: 8px;
      cursor: pointer; transition: all 0.3s; letter-spacing: 2px;
    }
    #startScreen button:hover { background: #e94560; color: #fff; box-shadow: 0 0 30px #e94560; }
    .controls-info {
      margin-top: 40px; text-align: left; color: #888; font-size: 14px; line-height: 2;
    }
    .controls-info span { color: #e94560; font-weight: bold; }

    /* HUD */
    #hud {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      display: none;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 30px; height: 30px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff;
    }
    #crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
    #crosshair::after { top: 0; left: 14px; width: 2px; height: 30px; }
    #crosshair .dot {
      position: absolute; top: 12px; left: 12px; width: 6px; height: 6px;
      background: #e94560; border-radius: 50%;
    }

    #healthBar {
      position: absolute; bottom: 30px; left: 30px;
      width: 250px; height: 20px; background: rgba(0,0,0,0.5);
      border: 2px solid #333; border-radius: 10px; overflow: hidden;
    }
    #healthFill {
      height: 100%; width: 100%; background: linear-gradient(90deg, #e94560, #f0a500);
      transition: width 0.3s;
    }
    #healthText {
      position: absolute; bottom: 55px; left: 30px; color: #fff; font-size: 14px;
    }

    #ammoHud {
      position: absolute; bottom: 30px; right: 30px;
      text-align: right; color: #fff; font-size: 18px;
    }
    #ammoHud .big { font-size: 42px; font-weight: bold; color: #e94560; }
    #ammoHud .total { color: #aaa; }

    #scoreHud {
      position: absolute; top: 20px; left: 30px; color: #fff; font-size: 20px;
    }
    #scoreHud .num { color: #e94560; font-weight: bold; font-size: 28px; }

    #waveHud {
      position: absolute; top: 20px; right: 30px; color: #fff; font-size: 18px;
    }
    #waveHud .num { color: #f0a500; font-weight: bold; font-size: 26px; }

    #reloadHint {
      position: absolute; bottom: 70px; right: 30px; color: #f0a500; font-size: 16px;
      display: none;
    }

    /* 死亡画面 */
    #deathScreen {
      position: fixed; inset: 0; z-index: 200; display: none;
      background: rgba(100,0,0,0.85); flex-direction: column;
      align-items: center; justify-content: center; color: #fff;
    }
    #deathScreen h2 { font-size: 64px; color: #e94560; margin-bottom: 10px; text-shadow: 0 0 20px #e94560; }
    #deathScreen p { font-size: 22px; margin-bottom: 30px; }
    #deathScreen button {
      padding: 12px 40px; font-size: 20px; border: 2px solid #e94560;
      background: transparent; color: #e94560; border-radius: 8px; cursor: pointer;
    }
    #deathScreen button:hover { background: #e94560; color: #fff; }

    /* 波次提示 */
    #waveAnnounce {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
      z-index: 150; color: #f0a500; font-size: 60px; font-weight: bold;
      text-shadow: 0 0 30px #f0a500; pointer-events: none;
      transition: transform 0.5s;
    }
    #waveAnnounce.show { transform: translate(-50%,-50%) scale(1); }
  </style>
</head>
<body>

<!-- 开始菜单 -->
<div id="startScreen">
  <h1>🔫 3D 枪战</h1>
  <p class="subtitle">生存射击 · 消灭所有敌人</p>
  <button onclick="startGame()">开始游戏</button>
  <div class="controls-info">
    <p><span>WASD</span> 移动 &nbsp;|&nbsp; <span>鼠标</span> 瞄准 &nbsp;|&nbsp; <span>左键</span> 射击</p>
    <p><span>R</span> 换弹 &nbsp;|&nbsp; <span>Shift</span> 冲刺 &nbsp;|&nbsp; <span>空格</span> 跳跃</p>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="crosshair"><div class="dot"></div></div>
  <div id="healthText">生命值</div>
  <div id="healthBar"><div id="healthFill"></div></div>
  <div id="ammoHud"><span class="big" id="ammoCurrent">30</span> / <span class="total" id="ammoTotal">90</span></div>
  <div id="reloadHint">按 R 换弹</div>
  <div id="scoreHud">击杀: <span class="num" id="scoreNum">0</span></div>
  <div id="waveHud">第 <span class="num" id="waveNum">1</span> 波</div>
</div>

<!-- 波次提示 -->
<div id="waveAnnounce"></div>

<!-- 死亡画面 -->
<div id="deathScreen">
  <h2>你死了</h2>
  <p>击杀: <span id="finalScore">0</span> | 到达波次: <span id="finalWave">1</span></p>
  <button onclick="location.reload()">再来一局</button>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
